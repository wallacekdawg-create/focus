<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescription Safety Eyewear Program | Alternative to National Safety Eyewear Suppliers | Focus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #181510;
        }

        .nav-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #1a1410;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .nav-tabs button {
            flex: 1;
            padding: 16px 20px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .nav-tabs button:hover {
            color: #ccc;
            background: rgba(255,255,255,0.05);
        }

        .nav-tabs button.active {
            color: #fff;
            border-bottom-color: #e6d6c4;
            background: rgba(255,255,255,0.02);
        }

        .content-container {
            margin-top: 60px;
            width: 100%;
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="nav-tabs">
        <button class="nav-btn active" data-page="home">Home</button>
        <button class="nav-btn" data-page="how-it-works">How It Works</button>
        <button class="nav-btn" data-page="safety">Safety Program</button>
        <button class="nav-btn" data-page="faq">FAQ</button>
    </div>

    <div class="content-container">
        <iframe class="page-frame active" data-page="home" src="pages/Focus-Home.html"></iframe>
        <iframe class="page-frame" data-page="how-it-works" src="pages/Focus-How-It-Works.html"></iframe>
        <iframe class="page-frame" data-page="safety" src="pages/Focus-Safety.html"></iframe>
        <iframe class="page-frame" data-page="faq" src="pages/Focus-FAQ.html"></iframe>
    </div>

    <script>
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = btn.dataset.page;

                // Update active tab
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update active iframe
                document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
                document.querySelector(`.page-frame[data-page="${page}"]`).classList.add('active');

                // Update URL
                history.pushState({ page }, '', `#${page}`);
            });
        });

        // Handle back/forward buttons
        window.addEventListener('popstate', (e) => {
            const page = e.state?.page || 'home';
            document.querySelector(`[data-page="${page}"]`).click();
        });

        // Handle URL hash on load
        const hash = window.location.hash.slice(1) || 'home';
        const btn = document.querySelector(`[data-page="${hash}"]`);
        if (btn) btn.click();
    </script>
</body>
</html>
